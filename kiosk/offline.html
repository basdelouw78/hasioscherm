<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hasioscherm - verbinding zoeken</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1116; color: #e6e8eb;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; cursor: none;
    user-select: none; -webkit-user-select: none; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; }
  #tijd { font-size: 22vh; font-weight: 200; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  #datum { font-size: 4vh; color: #9aa3ad; text-transform: capitalize; }
  #status { margin-top: 6vh; font-size: 3vh; color: #9aa3ad; display: flex; align-items: center; gap: 1.2vh; }
  .stip { width: 1.4vh; height: 1.4vh; border-radius: 50%; background: #e0a43a; animation: puls 1.6s ease-in-out infinite; }
  @keyframes puls { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  #naam { position: fixed; bottom: 2vh; right: 3vh; font-size: 2vh; color: #4b5560; }
  #instellingen { position: fixed; bottom: 2vh; left: 3vh; font-size: 2.2vh; color: #9aa3ad;
    background: #1a1f27; border: 1px solid #2a313b; border-radius: 1.2vh; padding: 1.4vh 2.4vh;
    text-decoration: none; }
</style>
</head>
<body>
<main>
  <div id="tijd">--:--</div>
  <div id="datum"></div>
  <div id="status"><span class="stip"></span><span id="tekst">Verbinding met Home Assistant zoeken…</span></div>
</main>
<div id="naam"></div>
<a id="instellingen" href="/setup/index.html">⚙ Instellingen</a>
<script>
  // Wordt getoond als Home Assistant (nog) niet bereikbaar is, en bij het
  // opstarten. Vraagt de lokale agent of HA bereikbaar is en gaat dan terug
  // naar de pagina in ?target=...
  const params = new URLSearchParams(location.search);
  let target = params.get("target");
  const tijd = document.getElementById("tijd");
  const datum = document.getElementById("datum");
  const tekst = document.getElementById("tekst");
  let pogingen = 0;

  function klok() {
    const nu = new Date();
    tijd.textContent = nu.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
    datum.textContent = nu.toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long" });
  }

  async function controleer() {
    pogingen++;
    try {
      const r = await fetch("/api/status", { cache: "no-store" });
      const s = await r.json();
      if (s.naam) document.getElementById("naam").textContent = s.naam + " · v" + s.versie;
      if (s.setup_nodig) { location.replace("/setup/index.html"); return; }
      if (!target) target = s.dashboard;
      if (s.ha_bereikbaar && target) {
        tekst.textContent = "Verbonden, dashboard laden…";
        location.replace(target);
        return;
      }
      tekst.textContent = "Verbinding met Home Assistant zoeken… (poging " + pogingen + ")";
    } catch (e) {
      tekst.textContent = "Scherm-software start op…";
    }
    setTimeout(controleer, pogingen < 10 ? 2000 : 5000);
  }

  klok();
  setInterval(klok, 1000);
  controleer();
</script>
</body>
</html>
