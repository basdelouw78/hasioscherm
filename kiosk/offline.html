<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hasioscherm</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1116; color: #e6e8eb;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "DejaVu Sans", sans-serif; cursor: none;
    user-select: none; -webkit-user-select: none; overflow: hidden; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  /* zelfde opbouw als het opstartscherm (Plymouth): logo op 42%, balk eronder */
  #logo { width: 900px; max-width: 70vw; margin-top: -8vh; }
  #balk { width: 520px; max-width: 50vw; height: 8px; background: #262d37; margin-top: 90px; overflow: hidden; }
  #vulling { height: 100%; width: 0; background: #3b82f6; transition: width .4s ease-out; }
  #status { margin-top: 32px; font-size: 22px; color: #9aa3ad; min-height: 30px; text-align: center; }
  #klok { position: fixed; top: 3vh; right: 4vh; text-align: right; color: #9aa3ad; }
  #tijd { font-size: 6vh; font-weight: 300; font-variant-numeric: tabular-nums; color: #e6e8eb; line-height: 1; }
  #datum { font-size: 2.2vh; margin-top: .6vh; }
  #naam { position: fixed; bottom: 2vh; right: 3vh; font-size: 2vh; color: #4b5560; }
  /* zelfde plek en stijl als op het opstartscherm */
  #versie { position: fixed; left: 0; right: 0; bottom: 36px; text-align: center; color: #6b7480;
    font: 26px "DejaVu Sans Mono", monospace; letter-spacing: 0; }
  #instellingen { position: fixed; bottom: 2vh; left: 3vh; font-size: 2.2vh; color: #9aa3ad;
    background: #1a1f27; border: 1px solid #2a313b; border-radius: 1.2vh; padding: 1.4vh 2.4vh;
    text-decoration: none; }
</style>
</head>
<body>
<main>
  <img id="logo" src="/merk/bdlsoft-logo.png" alt="Bdlsoft">
  <div id="balk"><div id="vulling"></div></div>
  <div id="status">&nbsp;</div>
</main>
<div id="klok"><div id="tijd">--:--</div><div id="datum"></div></div>
<div id="naam"></div>
<div id="versie"></div>
<a id="instellingen" href="/setup/index.html">⚙ <span id="inst-tekst">Instellingen</span></a>
<script>
  // Opstart- en offline-scherm. Toont het Bdlsoft-logo met een laadbalk,
  // vraagt de lokale agent of Home Assistant bereikbaar is en gaat dan door
  // naar de pagina in ?target=... (of het dashboard).
  const TEKST = {
    nl: {start: "Opstarten…", zoek: "Verbinding met Home Assistant zoeken…", poging: "poging",
         laden: "Dashboard laden…", inst: "Instellingen", loc: "nl-NL"},
    en: {start: "Starting…", zoek: "Looking for Home Assistant…", poging: "attempt",
         laden: "Loading dashboard…", inst: "Settings", loc: "en-GB"},
    de: {start: "Startet…", zoek: "Verbindung zu Home Assistant wird gesucht…", poging: "Versuch",
         laden: "Dashboard wird geladen…", inst: "Einstellungen", loc: "de-DE"},
  };
  let L = TEKST.nl;
  const params = new URLSearchParams(location.search);
  let target = params.get("target");
  const $ = id => document.getElementById(id);
  let pogingen = 0;
  const begin = Date.now();

  function klok() {
    const nu = new Date();
    $("tijd").textContent = nu.toLocaleTimeString(L.loc, { hour: "2-digit", minute: "2-digit" });
    $("datum").textContent = nu.toLocaleDateString(L.loc, { weekday: "long", day: "numeric", month: "long" });
  }

  // Rustig oplopende balk (net als het opstartscherm); vol bij doorsturen.
  let vol_ = false;
  function balk(vol) {
    if (vol) vol_ = true;
    if (vol_) { $("vulling").style.width = "100%"; return; }
    const t = (Date.now() - begin) / 1000;
    const p = Math.min(0.92, 0.35 + 0.6 * (t / (t + 8)));
    $("vulling").style.width = (p * 100).toFixed(1) + "%";
  }

  function taal(code) {
    L = TEKST[code] || TEKST.nl;
    document.documentElement.lang = code || "nl";
    $("inst-tekst").textContent = L.inst;
  }

  async function controleer() {
    pogingen++;
    try {
      const r = await fetch("/api/status", { cache: "no-store" });
      const s = await r.json();
      taal(s.taal);
      if (s.naam) $("naam").textContent = s.naam;
      if (s.versie) $("versie").textContent = "v" + s.versie;
      if (s.setup_nodig) { balk(true); setTimeout(() => location.replace("/setup/index.html"), 300); return; }
      if (!target) target = s.dashboard;
      if (s.ha_bereikbaar && target) {
        $("status").textContent = L.laden;
        balk(true);
        setTimeout(() => location.replace(target), 400);
        return;
      }
      $("status").textContent = pogingen > 2 ? L.zoek + " (" + L.poging + " " + pogingen + ")" : L.zoek;
    } catch (e) {
      $("status").textContent = L.start;
    }
    setTimeout(controleer, pogingen < 10 ? 2000 : 5000);
  }

  klok();
  setInterval(klok, 1000);
  setInterval(() => balk(false), 500);
  balk(false);
  controleer();
</script>
</body>
</html>
