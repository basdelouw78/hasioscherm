<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hasioscherm - setup</title>
<style>
  :root {
    --bg: #0e1116; --paneel: #161b22; --rand: #262d37; --tekst: #e6e8eb; --zacht: #9aa3ad;
    --accent: #3b82f6; --accent2: #2563eb; --goed: #22c55e; --fout: #ef4444; --waarsch: #e0a43a;
    --r: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tekst);
    font: 22px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "DejaVu Sans", sans-serif;
    user-select: none; -webkit-user-select: none; overflow: hidden; }
  #app { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
  nav { background: var(--paneel); border-right: 1px solid var(--rand); padding: 36px 24px; }
  nav h1 { font-size: 26px; margin: 0 0 4px; }
  nav .versie { color: var(--zacht); font-size: 16px; margin-bottom: 32px; }
  nav ol { list-style: none; padding: 0; margin: 0; counter-reset: s; }
  nav li { counter-increment: s; padding: 14px 12px; border-radius: 10px; color: var(--zacht);
    display: flex; gap: 14px; align-items: center; }
  nav li::before { content: counter(s); width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid var(--rand); display: grid; place-items: center; font-size: 17px; flex: none; }
  nav li.actief { background: #1d2430; color: var(--tekst); }
  nav li.actief::before { border-color: var(--accent); color: var(--accent); }
  nav li.klaar::before { content: "✓"; background: var(--goed); border-color: var(--goed); color: #fff; }
  main { display: flex; flex-direction: column; height: 100%; min-width: 0; }
  #inhoud { flex: 1; overflow-y: auto; padding: 40px 56px 24px; }
  #inhoud h2 { font-size: 34px; margin: 0 0 8px; }
  #inhoud p.uitleg { color: var(--zacht); margin: 0 0 28px; max-width: 1100px; }
  footer { display: flex; gap: 16px; justify-content: flex-end; padding: 20px 56px;
    border-top: 1px solid var(--rand); background: var(--paneel); }
  button { font: inherit; border: 0; border-radius: var(--r); padding: 18px 34px; cursor: pointer;
    background: #232a35; color: var(--tekst); min-height: 64px; }
  button.primair { background: var(--accent); color: #fff; }
  button.primair:active { background: var(--accent2); }
  button:disabled { opacity: .4; }
  button:active { transform: scale(.98); }
  .veld { margin-bottom: 26px; max-width: 1100px; }
  .veld > label { display: block; color: var(--zacht); font-size: 18px; margin-bottom: 8px; }
  input[type=text], input[type=password] { width: 100%; font: inherit; font-size: 26px; padding: 16px 20px;
    border-radius: var(--r); border: 2px solid var(--rand); background: #0b0e13; color: var(--tekst); }
  input.actief { border-color: var(--accent); }
  .rij { display: flex; gap: 24px; flex-wrap: wrap; }
  .rij > .veld { flex: 1; min-width: 260px; }
  .keuzes { display: flex; gap: 12px; flex-wrap: wrap; }
  .keuzes button { padding: 16px 26px; border: 2px solid var(--rand); background: #12171e; }
  .keuzes button.gekozen { border-color: var(--accent); background: #15233b; }
  .lijst { display: flex; flex-direction: column; gap: 8px; max-height: 380px; overflow-y: auto; }
  .lijst button { text-align: left; border: 2px solid var(--rand); background: #12171e; display: flex;
    justify-content: space-between; align-items: center; }
  .lijst button.gekozen { border-color: var(--accent); background: #15233b; }
  .lijst small { color: var(--zacht); }
  .melding { padding: 16px 20px; border-radius: var(--r); margin: 12px 0 20px; max-width: 1100px; }
  .melding.goed { background: #0f2a1a; color: #86efac; }
  .melding.fout { background: #2d1214; color: #fca5a5; }
  .melding.info { background: #13233a; color: #93c5fd; }
  .schuif { display: flex; align-items: center; gap: 20px; }
  .schuif input[type=range] { flex: 1; height: 44px; accent-color: var(--accent); }
  .schuif output { width: 110px; text-align: right; font-size: 26px; }
  .schakel { display: flex; align-items: center; justify-content: space-between; gap: 20px;
    padding: 16px 20px; background: #12171e; border: 2px solid var(--rand); border-radius: var(--r); }
  .schakel .knop { width: 84px; height: 46px; border-radius: 23px; background: #333b47; position: relative; flex: none; }
  .schakel .knop::after { content: ""; position: absolute; top: 5px; left: 5px; width: 36px; height: 36px;
    border-radius: 50%; background: #fff; transition: left .15s; }
  .schakel.aan .knop { background: var(--accent); }
  .schakel.aan .knop::after { left: 43px; }
  .tijdrij { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  .tijdrij input { width: 160px !important; text-align: center; }
  ol.plan { padding-left: 30px; max-width: 1200px; }
  ol.plan li { padding: 10px 0; border-bottom: 1px solid var(--rand); }
  ol.plan li.gedaan { color: #86efac; }
  /* toetsenbord */
  .tbtoon { margin-left: 1em; font-size: .8em; padding: .2em .8em; }
  #tb { position: fixed; left: 0; right: 0; bottom: 0; background: #1b2029; border-top: 1px solid var(--rand);
    padding: 12px 16px 16px; display: none; z-index: 10; box-shadow: 0 -10px 40px #0008; }
  #tb.open { display: block; }
  #tb .tbrij { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }
  #tb button { min-width: 0; flex: 0 0 120px; height: 76px; padding: 0; font-size: 28px; border-radius: 10px;
    background: #2a313c; }
  #tb button.breed { flex-basis: 190px; font-size: 22px; }
  #tb button.spatie { flex-basis: 560px; }
  #tb button.klaar { background: var(--accent); }
  #tb .voorbeeld { text-align: center; color: var(--zacht); font-size: 18px; margin-bottom: 8px; min-height: 26px; }
  body.tb-open #inhoud { padding-bottom: 470px; }
</style>
</head>
<body>
<div id="app">
  <nav>
    <h1>hasioscherm</h1>
    <div class="versie" id="versie">setup</div>
    <ol id="stappenlijst"></ol>
  </nav>
  <main>
    <div id="inhoud"></div>
    <footer>
      <button id="terug">Terug</button>
      <button id="sluiten">Sluiten</button>
      <button id="verder" class="primair">Volgende</button>
    </footer>
  </main>
</div>
<div id="tb"><div class="voorbeeld" id="tbvoorbeeld"></div><div id="tbtoetsen"></div></div>

<script>
"use strict";
/* ---------------- hulpfuncties ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(pad, data) {
  const opt = data === undefined ? {} : {
    method: "POST", headers: {"Content-Type": "application/json", "X-Hasioscherm": "1"},
    body: JSON.stringify(data)};
  const r = await fetch("/api/setup/" + pad, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.fout || ("Fout " + r.status));
  return j;
}

/* ---------------- toestand ---------------- */
const S = {
  naam: "Scherm woonkamer", rotatie: 90, stijl: "auto", browser: "cog",
  ha_url: "", koppeling: "automatisch", ha_token: "",
  dashboard_url: "standaard",
  mqtt: {host: "", port: 1883, gebruiker: "", wachtwoord: ""},
  gedrag: {timeout_minuten: 5, eerste_tik_alleen_wekken: true, helderheid_dag: 80, helderheid_nacht: 20,
           dag_begint: "07:00", nacht_begint: "22:00", uit_tijden: []},
  beweging: {entiteit: "", uit_na_minuten: 0},
  meldingen: {notify_dienst: ""},
  updates: {modus: "knop", repo: "basdelouw78/hasioscherm", token: ""},
  systeem: {alleen_lezen: true},
};
const T = { ingelogd: false, mfa: false, haGegevens: null, haTest: null, setupKlaar: false,
            netwerk: null, wifi: null, plan: null, bezig: false, melding: null };

const STAPPEN = [
  {id: "scherm", titel: "Scherm"},
  {id: "netwerk", titel: "Netwerk"},
  {id: "ha", titel: "Home Assistant"},
  {id: "koppeling", titel: "Koppelen"},
  {id: "gedrag", titel: "Gedrag"},
  {id: "automatisch", titel: "Beweging & meldingen"},
  {id: "overzicht", titel: "Overzicht"},
];
let stap = 0;

/* ---------------- toetsenbord ---------------- */
const TB = { veld: null, modus: "abc", shift: false, toon: false };
const LAYOUT = {
  abc: ["1234567890", "qwertyuiop", "asdfghjkl", "⇧zxcvbnm⌫", "#.@-_:/␣✓"],
  sym: ["1234567890", "!?&%+=*()", "#$€;,'\"<>", "abc[]{}~^⌫", "abc.@-_:/␣✓"],
  num: ["123", "456", "789", ".0:", "⌫✓"],
};
function tbTeken() {
  const rijen = LAYOUT[TB.modus];
  const html = rijen.map(r => {
    const toetsen = [];
    for (let i = 0; i < r.length; i++) {
      if (r.startsWith("abc", i) && TB.modus === "sym") { toetsen.push(`<button class="breed" data-k="abc">abc</button>`); i += 2; continue; }
      const ch = r[i];
      if (ch === "⇧") toetsen.push(`<button class="breed" data-k="shift">${TB.shift ? "⇪" : "⇧"}</button>`);
      else if (ch === "⌫") toetsen.push(`<button class="breed" data-k="bs">⌫</button>`);
      else if (ch === "␣") toetsen.push(`<button class="spatie" data-k=" ">spatie</button>`);
      else if (ch === "✓") toetsen.push(`<button class="breed klaar" data-k="ok">Klaar</button>`);
      else if (ch === "#" && TB.modus === "abc") toetsen.push(`<button class="breed" data-k="sym">#+=</button>`);
      else { const c = TB.shift ? ch.toUpperCase() : ch; toetsen.push(`<button data-k="${esc(c)}">${esc(c)}</button>`); }
    }
    return `<div class="tbrij">${toetsen.join("")}</div>`;
  }).join("");
  $("#tbtoetsen").innerHTML = html;
}
function tbOpen(veld) {
  if (TB.veld) TB.veld.classList.remove("actief");
  TB.veld = veld; veld.classList.add("actief");
  TB.modus = veld.dataset.tb || "abc"; TB.shift = false; TB.toon = false;
  $("#tb").classList.add("open"); document.body.classList.add("tb-open");
  tbTeken(); tbVoorbeeld();
  setTimeout(() => veld.scrollIntoView({block: "center", behavior: "smooth"}), 50);
}
function tbSluit() {
  if (TB.veld) { TB.veld.classList.remove("actief"); TB.veld.dispatchEvent(new Event("change", {bubbles: true})); }
  TB.veld = null; $("#tb").classList.remove("open"); document.body.classList.remove("tb-open");
}
function tbVoorbeeld() {
  if (!TB.veld) return;
  const geheim = TB.veld.type === "password";
  $("#tbvoorbeeld").textContent = geheim && !TB.toon ? "•".repeat(TB.veld.value.length) : TB.veld.value;
  if (geheim) $("#tbvoorbeeld").insertAdjacentHTML("beforeend",
    `<button class="tbtoon" data-k="toon">${TB.toon ? "verberg" : "toon"}</button>`);
}
$("#tbvoorbeeld").addEventListener("click", e => {
  if (e.target.closest(".tbtoon")) { TB.toon = !TB.toon; tbVoorbeeld(); e.stopPropagation(); }
});
$("#tb").addEventListener("pointerdown", e => e.preventDefault());
$("#tb").addEventListener("click", e => {
  const k = e.target.closest("button")?.dataset.k; if (!k || !TB.veld) return;
  const v = TB.veld;
  if (k === "ok") return tbSluit();
  if (k === "toon") { TB.toon = !TB.toon; tbVoorbeeld(); return; }
  if (k === "bs") v.value = v.value.slice(0, -1);
  else if (k === "shift") { TB.shift = !TB.shift; tbTeken(); return; }
  else if (k === "sym") { TB.modus = "sym"; tbTeken(); return; }
  else if (k === "abc") { TB.modus = "abc"; tbTeken(); return; }
  else { v.value += k; if (TB.shift) { TB.shift = false; tbTeken(); } }
  v.dispatchEvent(new Event("input", {bubbles: true})); tbVoorbeeld();
});
document.addEventListener("pointerdown", e => {
  const inp = e.target.closest("input[type=text], input[type=password]");
  if (inp) { e.preventDefault(); tbOpen(inp); }
  else if (!e.target.closest("#tb") && TB.veld) tbSluit();
});

/* ---------------- bouwstenen ---------------- */
function veld(label, pad, opts = {}) {
  const waarde = pad.split(".").reduce((o, k) => o?.[k], S) ?? "";
  return `<div class="veld"><label>${esc(label)}</label>
    <input type="${opts.wachtwoord ? "password" : "text"}" inputmode="none" data-pad="${pad}"
      data-tb="${opts.tb || "abc"}" value="${esc(waarde)}" placeholder="${esc(opts.placeholder || "")}"></div>`;
}
function keuzes(label, pad, opties) {
  const w = pad.split(".").reduce((o, k) => o?.[k], S);
  return `<div class="veld"><label>${esc(label)}</label><div class="keuzes">${opties.map(([v, t]) =>
    `<button data-keuze="${pad}" data-waarde='${esc(JSON.stringify(v))}' class="${v === w ? "gekozen" : ""}">${esc(t)}</button>`).join("")}</div></div>`;
}
function schuif(label, pad, min, max, stapje, eenheid) {
  const w = pad.split(".").reduce((o, k) => o?.[k], S);
  return `<div class="veld"><label>${esc(label)}</label><div class="schuif">
    <input type="range" min="${min}" max="${max}" step="${stapje}" value="${w}" data-pad="${pad}" data-num="1">
    <output>${w} ${eenheid}</output></div></div>`;
}
function schakel(label, pad) {
  const w = pad.split(".").reduce((o, k) => o?.[k], S);
  return `<div class="veld"><div class="schakel ${w ? "aan" : ""}" data-schakel="${pad}">
    <span>${esc(label)}</span><span class="knop"></span></div></div>`;
}
function zet(pad, waarde) {
  const keys = pad.split("."); let o = S;
  keys.slice(0, -1).forEach(k => o = o[k]); o[keys.at(-1)] = waarde;
}
function melding() {
  return T.melding ? `<div class="melding ${T.melding.soort}">${esc(T.melding.tekst)}</div>` : "";
}

/* ---------------- stappen ---------------- */
const SCHERMEN = {
  scherm: () => `
    <h2>Welkom</h2>
    <p class="uitleg">Stel dit scherm in. Alles is later te wijzigen: houd <b>3 vingers 4 seconden</b> op het scherm, of gebruik de knop <b>Setup openen</b> in Home Assistant of ⚙ op het offline-scherm.</p>
    ${veld("Naam van het scherm (zo heet het apparaat in Home Assistant)", "naam")}
    ${keuzes("Stand", "rotatie", [[90, "Liggend"], [270, "Liggend (180° gedraaid)"], [0, "Staand"], [180, "Staand (ondersteboven)"]])}
    ${keuzes("Stijl van het dashboard", "stijl", [["auto", "Automatisch dag/nacht"], ["donker", "Donker"], ["licht", "Licht"]])}
    <div class="veld"><label>Dashboard</label><div class="keuzes">
      <button data-dash="standaard" class="${S.dashboard_url === "standaard" ? "gekozen" : ""}">Standaard dashboard (meegeleverd)</button>
      <button data-dash="eigen" class="${S.dashboard_url !== "standaard" ? "gekozen" : ""}">Eigen dashboard</button></div></div>
    ${S.dashboard_url !== "standaard" ? veld("Eigen dashboard: pad op Home Assistant (bijv. /local/mijn/dash.html) of volledig adres", "dashboard_url") : `<p class="uitleg">Het standaard dashboard haalt zelf uit Home Assistant wat er is: weer, personen en per ruimte de lampen, schakelaars, klimaat en media.</p>`}
    ${keuzes("Browser", "browser", [["cog", "Cog (licht, aanbevolen)"], ["chromium", "Chromium (terugvaloptie)"]])}`,

  netwerk: () => {
    const n = T.netwerk;
    const app = n?.status?.apparaten || [];
    const kabel = app.find(a => a.soort === "ethernet" && a.status.startsWith("connected"));
    const wifi = T.wifi || [];
    return `<h2>Netwerk</h2>
      <p class="uitleg">${kabel ? "Er is een kabelverbinding (PoE). Wifi is niet nodig; je kunt deze stap overslaan." : "Geen kabelverbinding gevonden. Kies een wifi-netwerk."}</p>
      <div class="melding info">IP-adres: <b>${esc(n?.status?.ip || "…")}</b> ${app.map(a => ` · ${esc(a.apparaat)}: ${esc(a.status)}${a.verbinding ? " (" + esc(a.verbinding) + ")" : ""}`).join("")}</div>
      ${melding()}
      <div class="veld"><label>Wifi-netwerken</label><div class="lijst">
        ${wifi.length ? wifi.map(w => `<button data-wifi="${esc(w.ssid)}" class="${T.wifiKeuze === w.ssid ? "gekozen" : ""}">
          <span>${esc(w.ssid)}</span><small>${w.signaal}% ${w.beveiligd ? "🔒" : ""}</small></button>`).join("")
          : `<div class="melding info">Geen netwerken gevonden (of wifi niet beschikbaar).</div>`}
      </div></div>
      ${T.wifiKeuze ? `<div class="rij">${veld("Wachtwoord voor " + T.wifiKeuze, "_wifiww", {wachtwoord: true})}
        <div class="veld" style="flex:0"><label>&nbsp;</label><button class="primair" id="wifiverbind">Verbinden</button></div></div>` : ""}
      <button id="wifiscan">Opnieuw zoeken</button>`;
  },

  ha: () => `
    <h2>Home Assistant</h2>
    <p class="uitleg">Het adres van je Home Assistant in het lokale netwerk, bijvoorbeeld <b>192.168.1.10</b> (poort 8123 wordt automatisch toegevoegd).</p>
    <div class="rij">${veld("Adres van Home Assistant", "ha_url", {placeholder: "192.168.1.10", tb: "abc"})}
      <div class="veld" style="flex:0"><label>&nbsp;</label><button id="hatest">Testen</button></div></div>
    ${melding()}
    ${keuzes("Hoe wil je koppelen?", "koppeling", [["automatisch", "Automatisch (eenmalige admin-login)"], ["handmatig", "Handmatig (MQTT-gegevens zelf invullen)"]])}
    <p class="uitleg">${S.koppeling === "automatisch"
      ? "Automatisch: na een eenmalige admin-login maakt de wizard een eigen gebruiker en token voor dit scherm aan, en desgewenst automatiseringen. Je ziet eerst precies wat er gebeurt en moet dat bevestigen. Het admin-wachtwoord wordt niet bewaard."
      : "Handmatig: je vult zelf de MQTT-gebruiker en eventueel een token in. Er wordt niets in Home Assistant aangemaakt."}</p>`,

  koppeling: () => S.koppeling === "automatisch" ? `
    <h2>Eenmalige admin-login</h2>
    <p class="uitleg">Log in met een <b>beheerder</b>-account van Home Assistant. Dit wordt alleen gebruikt om de onderdelen in de volgende stappen aan te maken, en daarna vergeten.</p>
    ${melding()}
    ${T.ingelogd ? `<div class="melding goed">Ingelogd als beheerder. Ga verder.</div>` : T.mfa ? `
      <div class="rij">${veld("Verificatiecode (MFA)", "_mfa", {tb: "num"})}
      <div class="veld" style="flex:0"><label>&nbsp;</label><button class="primair" id="mfa">Bevestigen</button></div></div>` : `
      <div class="rij">${veld("Gebruikersnaam", "_admin")}${veld("Wachtwoord", "_adminww", {wachtwoord: true})}</div>
      <button class="primair" id="login">Inloggen</button>`}` : `
    <h2>Handmatige koppeling</h2>
    <p class="uitleg">De Mosquitto-add-on accepteert gewone Home Assistant-gebruikers. Maak bijvoorbeeld een gebruiker <b>hasioscherm</b> aan en vul die hier in.</p>
    <div class="rij">${veld("MQTT-server", "mqtt.host", {placeholder: "zelfde als Home Assistant"})}${veld("Poort", "mqtt.port", {tb: "num"})}</div>
    <div class="rij">${veld("MQTT-gebruiker", "mqtt.gebruiker")}${veld("MQTT-wachtwoord", "mqtt.wachtwoord", {wachtwoord: true, placeholder: T.mqttWwIngesteld ? "(ongewijzigd)" : ""})}</div>
    ${veld("Home Assistant-token (optioneel, voor het dashboard)", "ha_token", {wachtwoord: true, placeholder: T.tokenIngesteld ? "(ongewijzigd)" : ""})}`,

  gedrag: () => `
    <h2>Gedrag</h2>
    <p class="uitleg">Wanneer het scherm uit en aan gaat, en hoe fel het is. Timeout en helderheid kun je later ook vanuit Home Assistant aanpassen.</p>
    ${schuif("Scherm uit na zoveel minuten zonder aanraking (0 = nooit)", "gedrag.timeout_minuten", 0, 60, 1, "min")}
    ${schakel("Eerste tik op een donker scherm alleen wekken", "gedrag.eerste_tik_alleen_wekken")}
    <div class="rij">${schuif("Helderheid overdag", "gedrag.helderheid_dag", 5, 100, 5, "%")}${schuif("Helderheid 's nachts", "gedrag.helderheid_nacht", 1, 100, 1, "%")}</div>
    <div class="rij">${veld("Dag begint (UU:MM)", "gedrag.dag_begint", {tb: "num"})}${veld("Nacht begint (UU:MM)", "gedrag.nacht_begint", {tb: "num"})}</div>
    <div class="veld"><label>Vaste tijden waarop het scherm uit is (een tik wekt het tijdelijk)</label>
      ${S.gedrag.uit_tijden.map((u, i) => `<div class="tijdrij">
        <span>van</span><input type="text" inputmode="none" data-tb="num" data-pad="gedrag.uit_tijden.${i}.van" value="${esc(u.van)}">
        <span>tot</span><input type="text" inputmode="none" data-tb="num" data-pad="gedrag.uit_tijden.${i}.tot" value="${esc(u.tot)}">
        <button data-uitweg="${i}">Verwijderen</button></div>`).join("")}
      <button id="uitbij">+ Tijdvak toevoegen</button></div>
    ${keuzes("Software-updates", "updates.modus", [["knop", "Via knop in Home Assistant"], ["automatisch", "Automatisch 's nachts"]])}
    <div class="rij">${veld("Updates uit GitHub-repo (eigenaar/naam)", "updates.repo")}
      ${veld("GitHub-token (alleen nodig bij een privé-repo)", "updates.token", {wachtwoord: true, placeholder: T.updTokenIngesteld ? "(ongewijzigd)" : "leeg laten bij een openbare repo"})}</div>
    ${schakel("Beveiligde modus (alleen-lezen): stroomuitval kan de SSD niet beschadigen", "systeem.alleen_lezen")}`,

  automatisch: () => {
    if (S.koppeling !== "automatisch") return `<h2>Beweging & meldingen</h2>
      <p class="uitleg">Bij een handmatige koppeling maakt de wizard geen automatiseringen aan. Je kunt de blueprints uit de repo zelf importeren (map <b>blueprints</b>).</p>`;
    const g = T.haGegevens;
    if (!g) return `<h2>Beweging & meldingen</h2>${melding()}<p class="uitleg">Gegevens ophalen uit Home Assistant…</p>`;
    return `<h2>Beweging & meldingen</h2>
      <p class="uitleg">Optioneel. Kies een bewegingssensor (bijvoorbeeld een PIR van het alarm) die het scherm wekt, en een telefoon voor meldingen als het scherm offline gaat of te warm wordt.</p>
      ${melding()}
      <div class="rij">
        <div class="veld"><label>Bewegingssensor</label><div class="lijst">
          <button data-sel="beweging.entiteit" data-waarde="" class="${!S.beweging.entiteit ? "gekozen" : ""}">Geen (alleen aanraken)</button>
          ${g.bewegingssensoren.map(b => `<button data-sel="beweging.entiteit" data-waarde="${esc(b.entity_id)}" class="${S.beweging.entiteit === b.entity_id ? "gekozen" : ""}">
            <span>${esc(b.naam)}</span><small>${esc(b.entity_id)}</small></button>`).join("")}
        </div></div>
        <div class="veld"><label>Meldingen naar</label><div class="lijst">
          <button data-sel="meldingen.notify_dienst" data-waarde="" class="${!S.meldingen.notify_dienst ? "gekozen" : ""}">Geen meldingen</button>
          ${g.notify_diensten.map(n => `<button data-sel="meldingen.notify_dienst" data-waarde="${esc(n)}" class="${S.meldingen.notify_dienst === n ? "gekozen" : ""}">
            <span>${esc(n)}</span></button>`).join("")}
        </div></div>
      </div>
      ${S.beweging.entiteit ? schuif("Scherm uit na zoveel minuten zonder beweging (0 = niet)", "beweging.uit_na_minuten", 0, 60, 1, "min") : ""}`;
  },

  overzicht: () => {
    if (T.klaar) return `<h2>Klaar!</h2>
      <div class="melding goed">De instellingen zijn opgeslagen. Het scherm herstart de software en toont daarna het dashboard.</div>
      <ol class="plan">${T.klaar.map(t => `<li class="gedaan">✓ ${esc(t)}</li>`).join("")}</ol>
      <p class="uitleg">Elke wijziging staat ook in <b>hasioscherm-wijzigingen.log</b> op de boot-partitie.</p>`;
    return `<h2>Overzicht</h2>
      <p class="uitleg">Dit gaat er gebeuren. Er verandert niets totdat je op <b>Bevestigen</b> drukt.</p>
      ${melding()}
      ${T.plan ? `<ol class="plan">${T.plan.map(t => `<li>${esc(t)}</li>`).join("")}</ol>` : "<p>Plan maken…</p>"}`;
  },
};

/* ---------------- acties bij binnenkomst van een stap ---------------- */
async function bijBinnenkomst(id) {
  T.melding = null;
  try {
    if (id === "netwerk" && !T.netwerk) { T.netwerk = await api("wifi"); T.wifi = T.netwerk.netwerken; teken(); }
    if (id === "automatisch" && S.koppeling === "automatisch" && !T.haGegevens) {
      T.haGegevens = await api("ha/gegevens"); teken();
    }
    if (id === "overzicht" && !T.klaar) { T.plan = null; teken(); T.plan = (await api("plan", S)).stappen; teken(); }
  } catch (e) { T.melding = {soort: "fout", tekst: e.message}; teken(); }
}

function magVerder(id) {
  if (id === "scherm") return S.naam.trim().length > 0;
  if (id === "ha") return S.ha_url.trim().length > 0;
  if (id === "koppeling") return S.koppeling === "handmatig" ? !!S.mqtt.gebruiker : T.ingelogd;
  if (id === "overzicht") return !!T.plan && !T.bezig;
  return true;
}

/* ---------------- tekenen ---------------- */
function teken() {
  const id = STAPPEN[stap].id;
  $("#stappenlijst").innerHTML = STAPPEN.map((s, i) =>
    `<li class="${i === stap ? "actief" : i < stap ? "klaar" : ""}">${esc(s.titel)}</li>`).join("");
  $("#inhoud").innerHTML = SCHERMEN[id]();
  $("#terug").style.visibility = stap === 0 || T.klaar ? "hidden" : "visible";
  $("#sluiten").style.display = T.setupKlaar && !T.klaar ? "" : "none";
  const v = $("#verder");
  v.textContent = T.klaar ? "Naar dashboard" : id === "overzicht" ? (T.bezig ? "Bezig…" : "Bevestigen") : "Volgende";
  v.disabled = !T.klaar && !magVerder(id);
}

/* ---------------- invoer ---------------- */
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset.pad) return;
  let w = el.value;
  if (el.dataset.num) w = Number(w);
  if (el.dataset.pad === "mqtt.port") w = Number(w) || 1883;
  if (el.dataset.pad.startsWith("_")) { T[el.dataset.pad] = w; }
  else if (el.dataset.pad.includes("uit_tijden")) {
    const [, , i, k] = el.dataset.pad.split("."); S.gedrag.uit_tijden[+i][k] = w;
  } else zet(el.dataset.pad, w);
  if (el.type === "range") el.nextElementSibling.textContent = el.value + " " + el.nextElementSibling.textContent.split(" ").pop();
  $("#verder").disabled = !magVerder(STAPPEN[stap].id);
});
document.addEventListener("click", async e => {
  const b = e.target.closest("button, .schakel"); if (!b || b.closest("#tb")) return;
  try {
    if (b.dataset.keuze) { zet(b.dataset.keuze, JSON.parse(b.dataset.waarde)); T.melding = null; return teken(); }
    if (b.dataset.sel !== undefined) { zet(b.dataset.sel, b.dataset.waarde); return teken(); }
    if (b.dataset.schakel) { const p = b.dataset.schakel; zet(p, !p.split(".").reduce((o, k) => o[k], S)); return teken(); }
    if (b.dataset.wifi !== undefined) { T.wifiKeuze = b.dataset.wifi; T._wifiww = ""; return teken(); }
    if (b.dataset.dash) { S.dashboard_url = b.dataset.dash === "standaard" ? "standaard" : (S.dashboard_url === "standaard" ? "/local/" : S.dashboard_url); return teken(); }
    if (b.dataset.uitweg !== undefined) { S.gedrag.uit_tijden.splice(+b.dataset.uitweg, 1); return teken(); }
    switch (b.id) {
      case "uitbij": S.gedrag.uit_tijden.push({van: "23:30", tot: "06:30"}); return teken();
      case "wifiscan": T.netwerk = null; T.wifi = null; teken(); return bijBinnenkomst("netwerk");
      case "wifiverbind": {
        b.disabled = true; b.textContent = "Verbinden…";
        const r = await api("wifi", {ssid: T.wifiKeuze, wachtwoord: T._wifiww || ""});
        T.netwerk.status = r.status; T.melding = {soort: "goed", tekst: "Verbonden met " + T.wifiKeuze}; return teken();
      }
      case "hatest": {
        b.disabled = true; b.textContent = "Testen…";
        const r = await api("ha/test", {url: S.ha_url});
        if (r.url) S.ha_url = r.url;
        T.melding = r.home_assistant ? {soort: "goed", tekst: "Home Assistant gevonden op " + r.url}
          : r.bereikbaar ? {soort: "fout", tekst: "Er antwoordt iets op " + r.url + ", maar het lijkt geen Home Assistant."}
          : {soort: "fout", tekst: r.melding || "Niet bereikbaar"};
        return teken();
      }
      case "login": {
        b.disabled = true; b.textContent = "Inloggen…";
        const r = await api("ha/login", {url: S.ha_url, gebruiker: T._admin || "", wachtwoord: T._adminww || ""});
        T._adminww = ""; T.mfa = !!r.mfa; T.ingelogd = !!r.ok; T.haGegevens = null;
        T.melding = r.mfa ? {soort: "info", tekst: "Vul de code uit je authenticator-app in."} : null;
        return teken();
      }
      case "mfa": {
        const r = await api("ha/mfa", {code: T._mfa || ""});
        T.mfa = !!r.mfa; T.ingelogd = !!r.ok; T.melding = null; return teken();
      }
    }
  } catch (err) {
    T.melding = {soort: "fout", tekst: err.message}; teken();
  }
});

$("#terug").onclick = () => { if (stap > 0) { stap--; tbSluit(); teken(); bijBinnenkomst(STAPPEN[stap].id); } };
$("#sluiten").onclick = async () => { await api("afbreken", {}).catch(() => {}); location.replace("/offline.html"); };
$("#verder").onclick = async () => {
  tbSluit();
  if (T.klaar) { setTimeout(() => location.replace("/offline.html"), 500); return; }
  const id = STAPPEN[stap].id;
  if (id === "overzicht") {
    T.bezig = true; teken();
    try { T.klaar = (await api("toepassen", S)).gedaan; }
    catch (e) { T.melding = {soort: "fout", tekst: e.message}; }
    T.bezig = false; teken();
    if (T.klaar) setTimeout(() => location.replace("/offline.html"), 8000);
    return;
  }
  stap++; teken(); bijBinnenkomst(STAPPEN[stap].id);
};

/* ---------------- start ---------------- */
(async () => {
  try {
    const h = await api("huidig");
    $("#versie").textContent = "versie " + h.versie;
    T.setupKlaar = h.setup_klaar; T.mqttWwIngesteld = h.mqtt.wachtwoord_ingesteld; T.tokenIngesteld = h.ha_token_ingesteld;
    Object.assign(S, {naam: h.naam, rotatie: h.rotatie, stijl: h.stijl, browser: h.browser,
      dashboard_url: h.dashboard_url, koppeling: h.koppeling,
      ha_url: h.setup_klaar ? h.ha_url : "", gedrag: h.gedrag, beweging: h.beweging,
      meldingen: h.meldingen, systeem: h.systeem || {alleen_lezen: true}});
    S.updates = {modus: h.updates.modus, repo: h.updates.repo || "basdelouw78/hasioscherm", token: ""};
    T.updTokenIngesteld = !!h.updates.token_ingesteld;
    S.mqtt = {host: h.mqtt.host, port: h.mqtt.port, gebruiker: h.mqtt.gebruiker, wachtwoord: ""};
    S.gedrag.timeout_minuten = Number(S.gedrag.timeout_minuten);
  } catch (e) { T.melding = {soort: "fout", tekst: "Kon instellingen niet laden: " + e.message}; }
  teken();
})();
</script>
</body>
</html>
