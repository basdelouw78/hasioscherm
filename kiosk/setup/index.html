/* ---------------- scrollen met touch ---------------- */
// De kioskbrowser scrolt niet altijd zelf bij vegen; daarom doen we het hier.
// Een veeg van meer dan 10 px telt niet als tik.
(() => {
  let sc = null, startY = 0, startTop = 0, gesleept = false;
  const scroller = el => {
    for (let e = el; e && e !== document.body; e = e.parentElement) {
      if ((e.classList?.contains("lijst") || e.id === "inhoud") && e.scrollHeight > e.clientHeight + 1) return e;
    }
    return null;
  };
  const begin = (el, y) => {
    if (el.closest("#tb, input[type=range]")) { sc = null; return; }
    sc = scroller(el); startY = y; startTop = sc ? sc.scrollTop : 0; gesleept = false;
  };
  const beweeg = (y, e) => {
    if (!sc) return;
    const dy = y - startY;
    if (!gesleept && Math.abs(dy) < 10) return;
    gesleept = true; sc.scrollTop = startTop - dy;
    if (e.cancelable) e.preventDefault();
  };
  if ("ontouchstart" in window) {
    document.addEventListener("touchstart", e => begin(e.target, e.touches[0].clientY), {passive: true});
    document.addEventListener("touchmove", e => beweeg(e.touches[0].clientY, e), {passive: false});
    document.addEventListener("touchend", () => { sc = null; }, {passive: true});
  } else {
    document.addEventListener("pointerdown", e => begin(e.target, e.clientY));
    document.addEventListener("pointermove", e => { if (e.buttons) beweeg(e.clientY, e); });
    document.addEventListener("pointerup", () => { sc = null; });
  }
  // Na een veeg de klik eruit filteren.
  document.addEventListener("click", e => {
    if (gesleept) { gesleept = false; e.stopPropagation(); e.preventDefault(); }
  }, true);
})();

/* ---------------- toetsenbord ---------------- */
const TB = { veld: null, modus: "abc", shift: false, toon: false };
const LAYOUT = {
  abc: ["1234567890", "qwertyuiop", "asdfghjkl", "⇧zxcvbnm⌫", "#.@-_:/␣✓"],
  sym: ["1234567890", "!?&%+=*()", "#$€;,'\"<>", "abc[]{}~^⌫", "abc.@-_:/␣✓"],
  num: ["123", "456", "789", ".0:", "⌫✓"],
};
function tbTeken() {
  const rijen = LAYOUT[TB.modus];
  const html = rijen.map(r => {
    const toetsen = [];
    for (let i = 0; i < r.length; i++) {
      if (r.startsWith("abc", i) && TB.modus === "sym") { toetsen.push(`<button class="breed" data-k="abc">abc</button>`); i += 2; continue; }
      const ch = r[i];
      if (ch === "⇧") toetsen.push(`<button class="breed" data-k="shift">${TB.shift ? "⇪" : "⇧"}</button>`);
      else if (ch === "⌫") toetsen.push(`<button class="breed" data-k="bs">⌫</button>`);
      else if (ch === "␣") toetsen.push(`<button class="spatie" data-k=" ">${t("spatie")}</button>`);
      else if (ch === "✓") toetsen.push(`<button class="breed klaar" data-k="ok">${t("Klaar")}</button>`);
      else if (ch === "#" && TB.modus === "abc") toetsen.push(`<button class="breed" data-k="sym">#+=</button>`);
      else { const c = TB.shift ? ch.toUpperCase() : ch; toetsen.push(`<button data-k="${esc(c)}">${esc(c)}</button>`); }
    }
    return `<div class="tbrij">${toetsen.join("")}</div>`;
  }).join("");
  $("#tbtoetsen").innerHTML = html;
}
function tbOpen(veld) {
  if (TB.veld) TB.veld.classList.remove("actief");
  TB.veld = veld; veld.classList.add("actief");
  TB.modus = veld.dataset.tb || "abc"; TB.shift = false; TB.toon = false;
  $("#tb").classList.add("open"); document.body.classList.add("tb-open");
  tbTeken(); tbVoorbeeld();
  setTimeout(() => veld.scrollIntoView({block: "center", behavior: "smooth"}), 50);
}
function tbSluit() {
  if (TB.veld) { TB.veld.classList.remove("actief"); TB.veld.dispatchEvent(new Event("change", {bubbles: true})); }
  TB.veld = null; $("#tb").classList.remove("open"); document.body.classList.remove("tb-open");
}
function tbVoorbeeld() {
  if (!TB.veld) return;
  const geheim = TB.veld.type === "password";
  $("#tbvoorbeeld").textContent = geheim && !TB.toon ? "•".repeat(TB.veld.value.length) : TB.veld.value;
  if (geheim) $("#tbvoorbeeld").insertAdjacentHTML("beforeend",
    `<button class="tbtoon" data-k="toon">${TB.toon ? t("verberg") : t("toon")}</button>`);
}
$("#tbvoorbeeld").addEventListener("click", e => {
  if (e.target.closest(".tbtoon")) { TB.toon = !TB.toon; tbVoorbeeld(); e.stopPropagation(); }
});
$("#tb").addEventListener("pointerdown", e => e.preventDefault());
$("#tb").addEventListener("click", e => {
  const k = e.target.closest("button")?.dataset.k; if (!k || !TB.veld) return;
  const v = TB.veld;
  if (k === "ok") return tbSluit();
  if (k === "toon") { TB.toon = !TB.toon; tbVoorbeeld(); return; }
  if (k === "bs") v.value = v.value.slice(0, -1);
  else if (k === "shift") { TB.shift = !TB.shift; tbTeken(); return; }
  else if (k === "sym") { TB.modus = "sym"; tbTeken(); return; }
  else if (k === "abc") { TB.modus = "abc"; tbTeken(); return; }
  else { v.value += k; if (TB.shift) { TB.shift = false; tbTeken(); } }
  v.dispatchEvent(new Event("input", {bubbles: true})); tbVoorbeeld();
});
document.addEventListener("pointerdown", e => {
  const inp = e.target.closest("input[type=text], input[type=password]");
  if (inp) { e.preventDefault(); tbOpen(inp); }
  else if (!e.target.closest("#tb") && TB.veld) tbSluit();
});

/* ---------------- bouwstenen ---------------- */
function veld(label, pad, opts = {}) {
  const waarde = pad.startsWith("_") ? (T[pad] ?? "") : (pad.split(".").reduce((o, k) => o?.[k], S) ?? "");
  return `<div class="veld"><label>${esc(label)}</label>
    <input type="${opts.wachtwoord ? "password" : "text"}" inputmode="none" data-pad="${pad}"
      data-tb="${opts.tb || "abc"}" value="${esc(waarde)}" placeholder="${esc(opts.placeholder || "")}"></div>`;
}
function keuzes(label, pad, opties) {
  const w = pad.split(".").reduce((o, k) => o?.[k], S);
  return `<div class="veld"><label>${esc(label)}</label><div class="keuzes">${opties.map(([v, tekst]) =>
    `<button data-keuze="${pad}" data-waarde='${esc(JSON.stringify(v))}' class="${v === w ? "gekozen" : ""}">${esc(tekst)}</button>`).join("")}</div></div>`;
}
function schuif(label, pad, min, max, stapje, eenheid) {
  const w = pad.split(".").reduce((o, k) => o?.[k], S);
  return `<div class="veld"><label>${esc(label)}</label><div class="schuif">
    <input type="range" min="${min}" max="${max}" step="${stapje}" value="${w}" data-pad="${pad}" data-num="1">
    <output>${w} ${eenheid}</output></div></div>`;
}
function schakel(label, pad) {
  const w = pad.split(".").reduce((o, k) => o?.[k], S);
  return `<div class="veld"><div class="schakel ${w ? "aan" : ""}" data-schakel="${pad}">
    <span>${esc(label)}</span><span class="knop"></span></div></div>`;
}
function zet(pad, waarde) {
  const keys = pad.split("."); let o = S;
  keys.slice(0, -1).forEach(k => o = o[k]); o[keys.at(-1)] = waarde;
}
function melding() {
  return T.melding ? `<div class="melding ${T.melding.soort}">${esc(T.melding.tekst)}</div>` : "";
}
// Eenmalige admin-login (gebruikt bij automatisch koppelen en voor automatiseringen).
function loginBlok() {
  if (T.ingelogd) return `<div class="melding goed">${t("Ingelogd als beheerder.")}</div>`;
  if (T.mfa) return `<div class="rij">${veld(t("Verificatiecode (MFA)"), "_mfa", {tb: "num"})}
      <div class="veld" style="flex:0"><label>&nbsp;</label><button class="primair" id="mfa">${t("Bevestigen")}</button></div></div>`;
  return `<div class="rij">${veld(t("Gebruikersnaam"), "_admin")}${veld(t("Wachtwoord"), "_adminww", {wachtwoord: true})}</div>
      <button class="primair" id="login">${t("Inloggen")}</button>`;
}

/* ---------------- acties bij binnenkomst van een stap ---------------- */
async function bijBinnenkomst(id) {
  T.melding = null;
  try {
    if (id === "netwerk" && !T.netwerk) { T.netwerk = await api("wifi"); T.wifi = T.netwerk.netwerken; teken(); }
    if (id === "automatisch" && T.ingelogd && !T.haGegevens) {
      T.haGegevens = await api("ha/gegevens"); teken();
    }
    if (id === "overzicht" && !T.klaar) { T.plan = null; teken(); T.plan = (await api("plan", S)).stappen; teken(); }
  } catch (e) { T.melding = {soort: "fout", tekst: e.message}; teken(); }
}

function magVerder(id) {
  if (id === "scherm") return S.naam.trim().length > 0;
  if (id === "ha") return S.ha_url.trim().length > 0;
  if (id === "koppeling") return S.koppeling === "handmatig" ? !!S.mqtt.gebruiker : T.ingelogd;
  if (id === "overzicht") return !!T.plan && !T.bezig;
  return true;
}

/* ---------------- tekenen ---------------- */
function teken() {
  const id = STAPPEN[stap].id;
  $("#stappenlijst").innerHTML = STAPPEN.map((s, i) =>
    `<li class="${i === stap ? "actief" : i < stap ? "klaar" : ""}">${esc(s.titel())}</li>`).join("");
  const inhoud = $("#inhoud");
  const zelfdeStap = inhoud.dataset.stap === id;
  const top = inhoud.scrollTop;
  inhoud.innerHTML = SCHERMEN[id]();
  inhoud.dataset.stap = id;
  inhoud.scrollTop = zelfdeStap ? top : 0;
  $("#terug").textContent = t("Terug");
  $("#sluiten").textContent = t("Sluiten");
  $("#resetlabel").textContent = t("Fabrieksreset");
  const snel = T.setupKlaar && STAPPEN !== STAPPEN_VOL;
  $("#terug").style.visibility = T.klaar || (stap === 0 && !(T.setupKlaar && STAPPEN !== MENU)) ? "hidden" : "visible";
  $("#verder").style.display = id === "menu" ? "none" : "";
  $("#sluiten").style.display = T.setupKlaar && !T.klaar ? "" : "none";
  const v = $("#verder");
  v.textContent = T.klaar ? t("Naar dashboard") : id === "overzicht" ? (T.bezig ? t("Bezig…") : t("Bevestigen"))
    : snel ? t("Opslaan") : t("Volgende");
  v.disabled = T.wacht || (!T.klaar && !magVerder(id));
  $("#versie").textContent = T.versie ? t("versie {0}", T.versie) : "setup";
}

/* ---------------- invoer ---------------- */
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset.pad) return;
  let w = el.value;
  if (el.dataset.num) w = Number(w);
  if (el.dataset.pad === "mqtt.port") w = Number(w) || 1883;
  if (el.dataset.pad.startsWith("_")) { T[el.dataset.pad] = w; }
  else if (el.dataset.pad.includes("uit_tijden")) {
    const [, , i, k] = el.dataset.pad.split("."); S.gedrag.uit_tijden[+i][k] = w;
  } else zet(el.dataset.pad, w);
  if (el.type === "range") el.nextElementSibling.textContent = el.value + " " + el.nextElementSibling.textContent.split(" ").pop();
  $("#verder").disabled = !magVerder(STAPPEN[stap].id);
});
document.addEventListener("click", async e => {
  const b = e.target.closest("button, .schakel"); if (!b || b.closest("#tb")) return;
  try {
    if (b.dataset.taal) { zetTaal(b.dataset.taal); return teken(); }
    if (b.dataset.onderdeel) return snelOnderdeel(b.dataset.onderdeel);
    if (b.dataset.volledig) return volledigeSetup();
    if (b.dataset.keuze) { zet(b.dataset.keuze, JSON.parse(b.dataset.waarde)); T.melding = null; return teken(); }
    if (b.dataset.sel !== undefined) { zet(b.dataset.sel, b.dataset.waarde); return teken(); }
    if (b.dataset.schakel) { const p = b.dataset.schakel; zet(p, !p.split(".").reduce((o, k) => o[k], S)); return teken(); }
    if (b.dataset.wifi !== undefined) { T.wifiKeuze = b.dataset.wifi; T._wifiww = ""; return teken(); }
    if (b.dataset.dash) { S.dashboard_url = b.dataset.dash === "standaard" ? "standaard" : (S.dashboard_url === "standaard" ? "/local/" : S.dashboard_url); return teken(); }
    if (b.dataset.uitweg !== undefined) { S.gedrag.uit_tijden.splice(+b.dataset.uitweg, 1); return teken(); }
    switch (b.id) {
      case "uitbij": S.gedrag.uit_tijden.push({van: "23:30", tot: "06:30"}); return teken();
      case "wifiscan": T.netwerk = null; T.wifi = null; teken(); return bijBinnenkomst("netwerk");
      case "wifiverbind": {
        b.disabled = true; b.textContent = t("Verbinden…");
        const r = await api("wifi", {ssid: T.wifiKeuze, wachtwoord: T._wifiww || ""});
        T.netwerk.status = r.status; T.melding = {soort: "goed", tekst: t("Verbonden met {0}", T.wifiKeuze)}; return teken();
      }
      case "hatest": {
        b.disabled = true; b.textContent = t("Testen…");
        const r = await api("ha/test", {url: S.ha_url});
        if (r.url) S.ha_url = r.url;
        T.melding = r.home_assistant ? {soort: "goed", tekst: t("Home Assistant gevonden op {0}", r.url)}
          : r.bereikbaar ? {soort: "fout", tekst: t("Er antwoordt iets op {0}, maar het lijkt geen Home Assistant.", r.url)}
          : {soort: "fout", tekst: r.melding || t("Niet bereikbaar")};
        return teken();
      }
      case "login": {
        b.disabled = true; b.textContent = t("Inloggen…");
        const r = await api("ha/login", {url: S.ha_url, gebruiker: T._admin || "", wachtwoord: T._adminww || ""});
        T._adminww = ""; T.mfa = !!r.mfa; T.ingelogd = !!r.ok; T.haGegevens = null;
        T.melding = r.mfa ? {soort: "info", tekst: t("Vul de code uit je authenticator-app in.")} : null;
        teken();
        if (T.ingelogd) bijBinnenkomst(STAPPEN[stap].id);
        return;
      }
      case "mfa": {
        const r = await api("ha/mfa", {code: T._mfa || ""});
        T.mfa = !!r.mfa; T.ingelogd = !!r.ok; T.melding = null; teken();
        if (T.ingelogd) bijBinnenkomst(STAPPEN[stap].id);
        return;
      }
    }
  } catch (err) {
    T.melding = {soort: "fout", tekst: err.message}; teken();
  }
});

$("#terug").onclick = () => {
  if (stap > 0) { stap--; tbSluit(); teken(); bijBinnenkomst(STAPPEN[stap].id); }
  else if (T.setupKlaar && STAPPEN !== MENU) naarMenu();
};
$("#sluiten").onclick = async () => { await api("afbreken", {}).catch(() => {}); location.replace("/offline.html"); };
$("#verder").onclick = async () => {
  tbSluit();
  if (T.klaar) { naarDashboard(); return; }
  const id = STAPPEN[stap].id;
  if (id === "overzicht") {
    T.bezig = true; teken();
    let oudeStart = null;
    try { oudeStart = (await (await fetch("/api/status", {cache: "no-store"})).json()).gestart; } catch (e) {}
    try { const r = await api("toepassen", S); T.klaar = r.gedaan; T.herstart = r.herstart; T.oudeStart = oudeStart; }
    catch (e) { T.melding = {soort: "fout", tekst: e.message}; }
    T.bezig = false; teken();
    if (T.klaar) naarDashboard();
    return;
  }
  stap++; teken(); bijBinnenkomst(STAPPEN[stap].id);
};

/* ---------------- fabrieksreset ---------------- */
function resetVenster(open) {
  const v = $("#resetvenster");
  if (!open) { v.classList.remove("open"); return; }
  v.innerHTML = `<div class="kader">
    <h2>${t("Fabrieksreset")}</h2>
    <p>${t("Het scherm gaat terug naar de toestand van een vers geïnstalleerd image:")}</p>
    <ul>
      <li>${t("alle instellingen worden gewist (naam, Home Assistant, MQTT, tokens, gedrag)")}</li>
      <li>${t("opgeslagen wifi-netwerken worden vergeten")}</li>
      <li>${t("het apparaat verdwijnt uit Home Assistant")}</li>
      <li>${t("daarna herstart het scherm en begint de setup opnieuw")}</li>
    </ul>
    <p class="uitleg">${t("Wat de setup in Home Assistant heeft aangemaakt (gebruiker, automatiseringen) blijft bestaan; het wijzigingslog op de boot-partitie noemt wat je zelf kunt opruimen.")}</p>
    <div class="knoppen"><button id="resetnee">${t("Annuleren")}</button>
      <button class="gevaar" id="resetja">${t("Ja, alles wissen")}</button></div></div>`;
  v.classList.add("open");
}
document.addEventListener("click", async e => {
  const b = e.target.closest("#resetopen, #resetnee, #resetja"); if (!b) return;
  e.stopPropagation();
  if (b.id === "resetopen") return resetVenster(true);
  if (b.id === "resetnee") return resetVenster(false);
  b.disabled = true; b.textContent = t("Bezig…");
  try {
    await api("fabrieksreset", {bevestig: "RESET"});
    $("#resetvenster .kader").innerHTML = `<h2>${t("Fabrieksreset")}</h2><p>${t("Bezig met wissen. Het scherm herstart zo en begint daarna met de setup.")}</p>`;
  } catch (err) {
    b.disabled = false; b.textContent = t("Ja, alles wissen");
    $("#resetvenster .kader").insertAdjacentHTML("beforeend", `<div class="melding fout">${esc(err.message)}</div>`);
  }
}, true);

/* ---------------- na de setup ---------------- */
// Pas doorgaan als de software op het scherm echt opnieuw gestart is; anders
// toont de browser "pagina niet bereikbaar". Bij een herstart van het hele
// systeem gebeurt niets: de browser start daarna vanzelf op de goede pagina.
async function naarDashboard() {
  if (T.wacht) return;
  T.wacht = true; teken();
  $("#verder").disabled = true;
  if (T.herstart === "systeem") return;
  const begin = Date.now();
  await new Promise(r => setTimeout(r, 2500));
  while (Date.now() - begin < 120000) {
    try {
      const s = await (await fetch("/api/status", {cache: "no-store"})).json();
      if (s.gestart && s.gestart !== T.oudeStart) { location.replace("/offline.html"); return; }
    } catch (e) { /* software start nog */ }
    await new Promise(r => setTimeout(r, 1000));
  }
  location.replace("/offline.html");
}

/* ---------------- start ---------------- */
(async () => {
  try {
    const h = await api("huidig");
    T.versie = h.versie;
    zetTaal(h.taal || "nl");
    T.setupKlaar = h.setup_klaar; T.mqttWwIngesteld = h.mqtt.wachtwoord_ingesteld; T.tokenIngesteld = h.ha_token_ingesteld;
    Object.assign(S, {naam: h.naam, rotatie: h.rotatie, stijl: h.stijl, browser: h.browser,
      dashboard_url: h.dashboard_url, koppeling: h.koppeling,
      ha_url: h.setup_klaar ? h.ha_url : "", gedrag: h.gedrag, beweging: h.beweging,
      meldingen: h.meldingen, systeem: h.systeem || {alleen_lezen: true}});
    S.updates = {modus: h.updates.modus, repo: h.updates.repo || "basdelouw78/hasioscherm", token: ""};
    T.updTokenIngesteld = !!h.updates.token_ingesteld;
    S.mqtt = {host: h.mqtt.host, port: h.mqtt.port, gebruiker: h.mqtt.gebruiker, wachtwoord: ""};
    S.gedrag.timeout_minuten = Number(S.gedrag.timeout_minuten);
    T.koppelingOrigineel = h.koppeling;
    const q = new URLSearchParams(location.search);
    if (h.setup_klaar && q.get("volledig") !== "1") { STAPPEN = MENU; S.koppeling = "behouden"; }
  } catch (e) { T.melding = {soort: "fout", tekst: t("Kon instellingen niet laden: {0}", e.message)}; }
  teken();
  $("#resetlabel").textContent = t("Fabrieksreset");
  if (new URLSearchParams(location.search).get("reset") === "1") resetVenster(true);
})();
</script>
